<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alberto De Saint Malo — Portfolio</title>
    <meta
      name="description"
      content="Interactive 3D portfolio. Explore a cartoon physics world — push letters, jump, and discover."
    />
    <meta property="og:title" content="Alberto De Saint Malo — Portfolio" />
    <meta
      property="og:description"
      content="Interactive 3D portfolio with physics-based gameplay in a Wind Waker-inspired world."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./style/index.css" />
  </head>
  <body>
    <div class="game">
      <canvas class="js-canvas"></canvas>

      <!-- Loading screen -->
      <div class="js-loading loading">
        <div class="loading__text">Loading...</div>
        <div class="loading__bar">
          <div class="loading__bar-fill js-loading-bar"></div>
        </div>
      </div>

      <!-- HUD overlay -->
      <div class="js-hud hud" style="display: none">
        <div class="hud__tracker js-tracker">
          <span class="tracker__icon">&#9670;</span>
          <span class="js-tracker-count">0</span>/<span class="js-tracker-total">0</span>
        </div>
      </div>

      <!-- Content panel -->
      <div class="js-panel panel" style="display: none">
        <div class="panel__content js-panel-content"></div>
        <button class="panel__close js-panel-close">&#10005;</button>
      </div>

      <!-- Controls hint -->
      <div class="js-controls controls">
        <div class="controls__keys">
          <span>WASD</span> to move &middot; <span>SPACE</span> to jump
        </div>
      </div>
    </div>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
